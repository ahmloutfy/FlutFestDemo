name: flutfest
description: "A new Flutter project."
publish_to: 'none'

version: 1.1.0+7

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Assets
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  flutter_svg: ^2.2.3
  flutter_gutter: ^2.2.0
  flutter_html: ^3.0.0

  # State & Data
  get: ^4.7.2
  get_storage: ^2.1.1
  shared_preferences: ^2.5.4
  collection: ^1.19.1
  uuid: ^4.5.2
  intl: ^0.20.2

  # Plugins
  device_preview: ^1.2.0
  url_launcher: ^6.3.1
  share_plus: ^13.1.0
 # add_2_calendar: ^3.0.1
  image_picker: ^1.1.2
  google_maps_flutter: ^2.12.3
  geocoding: ^5.0.0
  geolocator: ^14.0.3
  google_generative_ai: ^0.4.5
  google_mobile_ads: ^9.0.0
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: true

  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#23354D"

  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FF8C00"
  image: assets/images/logo.png
  android_gravity: center
  ios_content_mode: center
  fullscreen: true
  android_12:
    image: assets/images/logo_square.png
    color: "#FF8C00"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/icons/social_media/
    - assets/images/
    - assets/images/events/
